<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 - 江苏省自行车电动车协会</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-mark">JBEA</div>
      <h1>后台管理系统</h1>
      <p>江苏省自行车电动车协会</p>
    </div>
    <form class="login-form" id="loginForm" autocomplete="off">
      <div>
        <label for="username">账号</label>
        <input type="text" id="username" name="username" required autofocus placeholder="admin">
      </div>
      <div>
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn">登 录</button>
    </form>
    <div id="errorBox" class="login-error" style="display:none"></div>
    <div class="login-hint">
      默认账号：<code>admin</code> / <code>jsbicycle2026</code>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // 已登录直接跳到仪表盘
    if (AUTH.isLoggedIn()) {
      location.replace('dashboard.html');
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const box = document.getElementById('errorBox');
      box.style.display = 'none';
      if (AUTH.login(u, p)) {
        location.replace('dashboard.html');
      } else {
        box.textContent = '账号或密码错误，请检查后重试';
        box.style.display = 'block';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
