<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政策标准 - 后台管理系统</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">JBEA Admin <span>政策标准管理</span></div>
      <div class="spacer"></div>
      <a href="../dashboard.html">← 返回仪表盘</a>
      <a href="../index.html" target="_blank">查看网站 ↗</a>
      <button onclick="AUTH.logout()">退出登录</button>
    </header>
    <div class="app-main">
      <aside class="app-side">
        <div class="group-title">概览</div>
        <a href="../dashboard.html">仪表盘</a>
        <div class="group-title">内容维护</div>
        <a href="news.html">新闻资讯</a>
        <a href="events.html">展会活动</a>
        <a href="magazines.html">行业杂志</a>
        <a href="standards.html" class="active">政策标准</a>
        <a href="branches.html">分支机构</a>
        <a href="wuxi-office.html">无锡办公室</a>
        <a href="downloads.html">下载资料</a>
        <div class="group-title">页面配置</div>
        <a href="navigation.html">顶部导航</a>
        <a href="footer.html">底部信息</a>
        <a href="homepage.html">首页内容</a>
        <div class="group-title">数据管理</div>
        <a href="#" onclick="event.preventDefault(); Store.exportKey('standards');">导出本模块</a>
      </aside>
      <main class="app-content">
        <h1 class="page-title">政策标准管理</h1>
        <p class="page-subtitle">政策法规、国家标准、团体标准、认证规则文件。</p>

        <div id="list"></div>

        <div class="card mt-4">
          <div class="card-head"><h3 id="formTitle">添加政策标准</h3></div>
          <div class="card-body">
            <form id="stdForm">
              <input type="hidden" id="editIdx">
              <div class="field-row">
                <div class="field"><label>URL ID *</label><input type="text" id="id" required placeholder="battery"></div>
                <div class="field"><label>类型</label>
                  <select id="type">
                    <option>国家标准</option>
                    <option>团体标准</option>
                    <option>政策法规</option>
                    <option>认证规则</option>
                  </select>
                </div>
              </div>
              <div class="field"><label>标题 *</label><input type="text" id="title" required></div>
              <div class="field-row">
                <div class="field"><label>发布日期</label><input type="text" id="publishedAt" placeholder="2024-05-14"></div>
                <div class="field"><label>状态</label><input type="text" id="status" placeholder="现行有效 / 征求意见阶段"></div>
              </div>
              <div class="field"><label>简介 / 摘要</label><textarea id="summary" rows="3"></textarea></div>
              <div class="field"><label>内部文件 URL</label>
                              <div class="field-row" style="gap:8px;align-items:center">
                                <input type="text" id="fileUrl" placeholder="./assets/standard-battery.pdf" style="flex:1">
                                <button type="button" class="btn" id="uploadPdfBtn">📤 上传 PDF</button>
                                <input type="file" id="pdfFileInput" accept="application/pdf" style="display:none">
                              </div>
                              <small id="pdfStatus" style="color:#6c7a90"></small>
                            </div>
              <div class="field"><label>外部链接 URL</label><input type="text" id="externalUrl" placeholder="https://..."></div>
              <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存到列表</button>
                <button type="button" class="btn" onclick="resetForm()">清空表单</button>
              </div>
            </form>
          </div>
        </div>

        <div class="btn-group mt-4">
          <button class="btn btn-primary" onclick="saveAll()">保存所有修改到本地</button>
          <button id="publishBtn" class="btn" style="background:#0a8a4a;color:#fff;font-weight:600" onclick="publishThisModule()">🚀 发布到网站（仅本模块）</button>
          <button class="btn" onclick="Store.exportKey('standards')">导出 JSON</button>
          <button class="btn" onclick="resetData()">恢复默认</button>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/github.js"></script>
  <script>
    AUTH.guard();
    let data = [];
    async function init() { await Store.loadAll(); data = Store.get('standards') || []; render(); initPdfUpload(); }
    function render() {
        const list = document.getElementById('list');
        if (!data.length) { list.innerHTML = '<div class="empty">暂无文件</div>'; return; }
        list.innerHTML = data.map((it, i) => `
            <div class="list-item">
                <div class="list-item-main">
                    <div class="list-item-title">${UI.escapeHtml(it.title || '')}</div>
                    <div class="list-item-meta">
                        <span class="tag tag-blue">${UI.escapeHtml(it.type || '')}</span>
                        <span class="tag">${UI.escapeHtml(it.status || '')}</span>
                        <span class="text-muted">${UI.escapeHtml(it.publishedAt || '')}</span>
                    </div>
                </div>
                <button class="btn btn-sm" onclick="editItem(${i})">编辑</button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${i})">删除</button>
            </div>
        `).join('');
    }
    function collect() {
        const g = id => document.getElementById(id).value.trim();
        return {
            id: g('id'), type: g('type'), title: g('title'),
            publishedAt: g('publishedAt'), status: g('status'),
            summary: g('summary'), fileUrl: g('fileUrl'), externalUrl: g('externalUrl')
        };
    }
    function fill(it) {
        document.getElementById('editIdx').value = data.indexOf(it);
        ['id','type','title','publishedAt','status','summary','fileUrl','externalUrl'].forEach(k => {
            document.getElementById(k).value = it[k] || '';
        });
        document.getElementById('formTitle').textContent = '编辑：' + (it.title || '');
    }
    function resetForm() {
        document.getElementById('stdForm').reset();
        document.getElementById('editIdx').value = '';
        document.getElementById('formTitle').textContent = '添加政策标准';
    }
    function editItem(i) { fill(data[i]); window.scrollTo({ top: document.getElementById('stdForm').offsetTop - 80, behavior: 'smooth' }); }
    function deleteItem(i) { if (!confirm('删除？')) return; data.splice(i, 1); render(); resetForm(); }
    document.getElementById('stdForm').addEventListener('submit', e => {
        e.preventDefault();
        const it = collect();
        if (!it.id || !it.title) { UI.toast('请填写 ID 和标题', 'error'); return; }
        const idx = document.getElementById('editIdx').value;
        if (idx === '') data.unshift(it); else data[+idx] = it;
        render(); resetForm();
        UI.toast('已暂存到列表', 'success');
    });
    function saveAll() { Store.set('standards', data); UI.toast('已保存到浏览器本地', 'success'); }
    async function resetData() {
        if (!confirm('恢复默认会丢弃所有修改。继续？')) return;
        await Store.reset('standards');
        data = Store.get('standards') || [];
        render(); resetForm();
        UI.toast('已恢复默认数据', 'success');
    }

    /* ========== PDF 上传 ========== */
    function initPdfUpload() {
      const btn = document.getElementById('uploadPdfBtn');
      const input = document.getElementById('pdfFileInput');
      const statusEl = document.getElementById('pdfStatus');
      const fileUrlEl = document.getElementById('fileUrl');
      if (!btn || !input) return;
      btn.addEventListener('click', () => input.click());
      input.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!GitHub.isConfigured()) {
          UI.toast('请先在“⚙ GitHub 自动部署”配置仓库信息', 'error');
          window.location.href = '../github-config.html';
          return;
        }
        const currentId = document.getElementById('id').value.trim() || file.name.replace(/\.pdf$/i, '');
        const safeId = currentId.replace(/[^\w一-龥\-]/g, '_');
        const fileName = `standard-${safeId}.pdf`;
        const targetPath = `public/assets/${fileName}`;
        statusEl.textContent = `上传中 ${file.name}（${(file.size/1024).toFixed(0)} KB）…`;
        statusEl.style.color = '#2c7ec5';
        btn.disabled = true;
        try {
          const res = await GitHub.uploadAsset(file, targetPath);
          const url = `./assets/${fileName}`;
          fileUrlEl.value = url;
          statusEl.innerHTML = `✓ 上传成功：<a href="${url}" target="_blank" rel="noopener">预览 PDF</a> · 下次“一键发布”后网站可见`;
          statusEl.style.color = '#2a8c4a';
          UI.toast('PDF 已上传到 GitHub', 'success');
          return res;
        } catch (err) {
          statusEl.textContent = `✗ 上传失败：${err.message}`;
          statusEl.style.color = '#d33';
          UI.toast('上传失败：' + err.message, 'error');
          throw err;
        } finally {
          btn.disabled = false;
          input.value = '';
        }
      });
    }

    /* ========== 单模块发布到网站 ========== */
    async function publishThisModule() {
        const btn = document.getElementById('publishBtn');
        if (!GitHub.isConfigured()) {
            UI.toast('请先在 “⚙ GitHub 自动部署” 配置仓库信息', 'error');
            window.location.href = '../github-config.html';
            return;
        }
        if (!confirm('仅发布【政策标准】模块到网站？其他模块不受影响。\n\n发布后 Cloudflare Pages 将自动构建部署，约 1-3 分钟生效。')) return;
        // 先同步当前表单到列表并保存到本地
        saveAll();
        const oldText = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '⏳ 发布中…'; }
        try {
            await GitHub.publishStandards();
            UI.toast('🎉【政策标准】发布成功！1-3 分钟后前台生效', 'success');
            if (btn) btn.textContent = '✅ 已发布（再点可重新发布）';
        } catch (e) {
            console.error('[publishThisModule] 失败：', e);
            UI.toast('❌ 发布失败：' + e.message, 'error');
            if (btn) btn.textContent = oldText;
        } finally {
            if (btn) setTimeout(() => { btn.disabled = false; }, 1500);
        }
    }

    init();
  </script>
</body>
</html>
