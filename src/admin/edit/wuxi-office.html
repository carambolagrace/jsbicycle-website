<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无锡办公室 - 后台管理系统</title>
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .table-edit { background: #fafbfc; padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; }
    .table-edit th { font-size: 11px; color: #6c7a8f; padding: 4px 8px; text-align: left; font-weight: 600; background: #f0f5fb; }
    .table-edit td { padding: 4px; }
    .table-edit input { width: 100%; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">JBEA Admin <span>无锡办公室管理</span></div>
      <div class="spacer"></div>
      <a href="../dashboard.html">← 返回仪表盘</a>
      <a href="../../index.html" target="_blank">查看网站 ↗</a>
      <button onclick="AUTH.logout()">退出登录</button>
    </header>
    <div class="app-main">
      <aside class="app-side">
        <div class="group-title">概览</div>
        <a href="../dashboard.html">仪表盘</a>
        <div class="group-title">内容维护</div>
        <a href="news.html">新闻资讯</a>
        <a href="events.html">展会活动</a>
        <a href="magazines.html">行业杂志</a>
        <a href="standards.html">政策标准</a>
        <a href="branches.html">分支机构</a>
        <a href="wuxi-office.html" class="active">无锡办公室</a>
        <a href="downloads.html">下载资料</a>
        <div class="group-title">页面配置</div>
        <a href="navigation.html">顶部导航</a>
        <a href="footer.html">底部信息</a>
        <a href="homepage.html">首页内容</a>
        <div class="group-title">数据管理</div>
        <a href="#" onclick="event.preventDefault(); Store.exportKey('wuxiOffice');">导出本模块</a>
      </aside>
      <main class="app-content">
        <h1 class="page-title">无锡办公室成员管理</h1>
        <p class="page-subtitle">江苏省自行车电动车协会无锡市电动车行业办公室成员名单。</p>

        <div class="card">
          <div class="card-body">
            <div class="table-edit">
              <table style="width:100%; border-collapse: collapse;">
                <thead>
                  <tr id="headerRow"></tr>
                </thead>
                <tbody id="rowsBody"></tbody>
              </table>
              <div style="margin-top:12px;">
                <button class="btn btn-sm btn-primary" onclick="addRow()">+ 添加一行</button>
              </div>
            </div>
          </div>
        </div>

        <div class="btn-group mt-4">
          <button class="btn btn-publish-wuxiOffice" style="background:#0a8a4a;color:#fff;font-weight:600" onclick="publishModule({key:'wuxiOffice', label:'无锡办公室', saveFn:saveAll})">🚀 发布到网站（仅本模块）</button>
          <button class="btn btn-primary" onclick="saveAll()">保存所有修改到本地</button>
          <button class="btn" onclick="Store.exportKey('wuxiOffice')">导出 JSON</button>
          <button class="btn" onclick="resetData()">恢复默认</button>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/github.js"></script>
  <script src="../js/publish-helper.js"></script>
  <script>
    AUTH.guard();
    let data = null;

    async function init() {
        await Store.loadAll();
        data = Store.get('wuxiOffice') || { roster: { headers: [], rows: [] } };
        render();
    }

    function render() {
        const t = data.roster || { headers: [], rows: [] };
        const headers = t.headers || [];
        const rows = t.rows || [];
        const headerRow = document.getElementById('headerRow');
        headerRow.innerHTML = headers.map((h, i) => `<th>${UI.escapeHtml(h)}</th>`).join('') + '<th style="width:60px">操作</th>';
        renderRows();
    }

    function renderRows() {
        const t = data.roster;
        const headers = t.headers || [];
        const rows = t.rows || [];
        const tbody = document.getElementById('rowsBody');
        tbody.innerHTML = rows.map((row, ri) => `
            <tr>
                ${headers.map((h, ci) => `<td><input type="text" value="${UI.escapeAttr(row[ci] || '')}" oninput="updateCell(${ri}, ${ci}, this.value)"></td>`).join('')}
                <td><button class="remove" onclick="removeRow(${ri})">×</button></td>
            </tr>
        `).join('');
    }

    function updateCell(r, c, val) { data.roster.rows[r][c] = val; }
    function addRow() {
        const t = data.roster;
        const cols = (t.headers || []).length;
        t.rows.push(new Array(cols).fill(''));
        renderRows();
    }
    function removeRow(r) {
        if (!confirm('删除此行？')) return;
        data.roster.rows.splice(r, 1);
        renderRows();
    }

    function saveAll() { Store.set('wuxiOffice', data); UI.toast('已保存到浏览器本地', 'success'); }
    async function resetData() {
        if (!confirm('恢复默认会丢弃所有修改。继续？')) return;
        await Store.reset('wuxiOffice');
        data = Store.get('wuxiOffice');
        render();
        UI.toast('已恢复默认数据', 'success');
    }

    init();
  </script>
</body>
</html>
