<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载资料 - 后台管理系统</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">JBEA Admin <span>下载资料管理</span></div>
      <div class="spacer"></div>
      <a href="../dashboard.html">← 返回仪表盘</a>
      <a href="../index.html" target="_blank">查看网站 ↗</a>
      <button onclick="AUTH.logout()">退出登录</button>
    </header>
    <div class="app-main">
      <aside class="app-side">
        <div class="group-title">概览</div>
        <a href="../dashboard.html">仪表盘</a>
        <div class="group-title">内容维护</div>
        <a href="news.html">新闻资讯</a>
        <a href="events.html">展会活动</a>
        <a href="magazines.html">行业杂志</a>
        <a href="standards.html">政策标准</a>
        <a href="branches.html">分支机构</a>
        <a href="wuxi-office.html">无锡办公室</a>
        <a href="downloads.html" class="active">下载资料</a>
        <div class="group-title">页面配置</div>
        <a href="navigation.html">顶部导航</a>
        <a href="footer.html">底部信息</a>
        <a href="homepage.html">首页内容</a>
        <div class="group-title">数据管理</div>
        <a href="#" onclick="event.preventDefault(); Store.exportKey('downloads');">导出本模块</a>
      </aside>
      <main class="app-content">
        <h1 class="page-title">下载资料管理</h1>
        <p class="page-subtitle">入会申请、表格、文件下载资源。</p>

        <div id="list"></div>

        <div class="card mt-4">
          <div class="card-head"><h3 id="formTitle">添加下载资料</h3></div>
          <div class="card-body">
            <form id="dlForm">
              <input type="hidden" id="editIdx">
              <div class="field-row">
                <div class="field"><label>ID *</label><input type="text" id="id" required></div>
                <div class="field"><label>分类</label>
                  <select id="category">
                    <option>会员申请</option>
                    <option>分支机构</option>
                    <option>行业杂志</option>
                    <option>政策标准</option>
                    <option>其他</option>
                  </select>
                </div>
              </div>
              <div class="field"><label>显示标题 *</label><input type="text" id="title" required></div>
              <div class="field"><label>说明</label><textarea id="description" rows="2"></textarea></div>
              <div class="field-row">
                <div class="field"><label>文件名</label><input type="text" id="filename"></div>
                <div class="field"><label>文件大小</label><input type="text" id="size" placeholder="约 1.2 MB"></div>
              </div>
              <div class="field"><label>下载 URL *</label><input type="text" id="url" required placeholder="./assets/file.pdf 或 https://..."></div>
              <div class="btn-group">
                <button type="submit" class="btn btn-primary">保存到列表</button>
                <button type="button" class="btn" onclick="resetForm()">清空表单</button>
              </div>
            </form>
          </div>
        </div>

        <div class="btn-group mt-4">
          <button class="btn btn-primary" onclick="saveAll()">保存所有修改到本地</button>
          <button class="btn" onclick="Store.exportKey('downloads')">导出 JSON</button>
          <button class="btn" onclick="resetData()">恢复默认</button>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/store.js"></script>
  <script>
    AUTH.guard();
    let data = [];
    async function init() { await Store.loadAll(); data = Store.get('downloads') || []; render(); }
    function render() {
        const list = document.getElementById('list');
        if (!data.length) { list.innerHTML = '<div class="empty">暂无下载资料</div>'; return; }
        list.innerHTML = data.map((it, i) => `
            <div class="list-item">
                <div class="list-item-main">
                    <div class="list-item-title">${UI.escapeHtml(it.title || '')}</div>
                    <div class="list-item-meta">
                        <span class="tag tag-blue">${UI.escapeHtml(it.category || '')}</span>
                        <span class="tag">${UI.escapeHtml(it.size || '')}</span>
                        <span class="text-muted">${UI.escapeHtml(it.filename || '')}</span>
                    </div>
                </div>
                <button class="btn btn-sm" onclick="editItem(${i})">编辑</button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${i})">删除</button>
            </div>
        `).join('');
    }
    function collect() {
        const g = id => document.getElementById(id).value.trim();
        return {
            id: g('id'), category: g('category'), title: g('title'),
            description: g('description'), filename: g('filename'),
            size: g('size'), url: g('url')
        };
    }
    function fill(it) {
        document.getElementById('editIdx').value = data.indexOf(it);
        ['id','category','title','description','filename','size','url'].forEach(k => {
            document.getElementById(k).value = it[k] || '';
        });
        document.getElementById('formTitle').textContent = '编辑：' + (it.title || '');
    }
    function resetForm() {
        document.getElementById('dlForm').reset();
        document.getElementById('editIdx').value = '';
        document.getElementById('formTitle').textContent = '添加下载资料';
    }
    function editItem(i) { fill(data[i]); window.scrollTo({ top: document.getElementById('dlForm').offsetTop - 80, behavior: 'smooth' }); }
    function deleteItem(i) { if (!confirm('删除？')) return; data.splice(i, 1); render(); resetForm(); }
    document.getElementById('dlForm').addEventListener('submit', e => {
        e.preventDefault();
        const it = collect();
        if (!it.id || !it.title || !it.url) { UI.toast('请填写必填字段', 'error'); return; }
        const idx = document.getElementById('editIdx').value;
        if (idx === '') data.push(it); else data[+idx] = it;
        render(); resetForm();
        UI.toast('已暂存到列表', 'success');
    });
    function saveAll() { Store.set('downloads', data); UI.toast('已保存到浏览器本地', 'success'); }
    async function resetData() {
        if (!confirm('恢复默认会丢弃所有修改。继续？')) return;
        await Store.reset('downloads');
        data = Store.get('downloads') || [];
        render(); resetForm();
        UI.toast('已恢复默认数据', 'success');
    }
    init();
  </script>
</body>
</html>
